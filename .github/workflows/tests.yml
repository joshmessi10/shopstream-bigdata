name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        # If lambda-validator has requirements, install them here
        if [ -f lambda-validator/requirements.txt ]; then pip install -r lambda-validator/requirements.txt; fi
        
    - name: Run Pytest
      run: |
        pytest
